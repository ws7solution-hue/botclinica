<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>BotClínica — Área do Parceiro</title>
<link rel="icon" type="image/png" href="/logo-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --navy:#0D2A3D; --blue:#1A6FA8; --blue2:#135480; --green:#06AA48;
  --bg:#F0F2F5; --card:#FFFFFF; --border:#E2E8F0; --text:#1F2937; --muted:#6B7280;
  --yellow:#B45309; --yellow-l:#FEF3C7; --red:#DC2626; --red-l:#FEE2E2; --green-l:#D1FAE5;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:var(--bg);color:var(--text)}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy),var(--blue2));padding:20px}
.login-card{background:var(--card);border-radius:20px;padding:40px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-card img{width:64px;display:block;margin:0 auto 16px}
.login-card h1{font-size:20px;text-align:center;margin-bottom:4px;color:var(--navy)}
.login-card p{font-size:13px;text-align:center;color:var(--muted);margin-bottom:24px}
label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;margin-bottom:14px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
button{cursor:pointer;border:none;font-family:inherit;font-weight:700}
.btn-primary{background:var(--blue);color:#fff;padding:12px;border-radius:10px;width:100%;font-size:14px}
.btn-primary:hover{background:var(--blue2)}
.error-msg{background:var(--red-l);color:var(--red);padding:10px 14px;border-radius:10px;font-size:12px;margin-bottom:14px;display:none}

.app{display:none}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-left img{width:32px}
.topbar-left .name{font-weight:800;font-size:15px}
.topbar-left .sub{font-size:11px;color:var(--muted)}
.btn-logout{background:transparent;color:var(--muted);font-size:12px;padding:8px 12px;border-radius:8px}
.btn-logout:hover{background:var(--bg)}

.container{max-width:1000px;margin:0 auto;padding:24px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
@media(max-width:700px){.grid-3{grid-template-columns:1fr}}
.kpi{background:var(--card);border-radius:14px;padding:18px;border:1px solid var(--border)}
.kpi .label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.kpi .val{font-size:26px;font-weight:800;margin-top:4px}

.card{background:var(--card);border-radius:16px;padding:22px;border:1px solid var(--border);margin-bottom:20px}
.card-title{font-size:15px;font-weight:800;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.form-row{grid-template-columns:1fr}}

.lead-item{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.lead-item .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.lead-item .nome{font-weight:700;font-size:14px}
.lead-item .contato{font-size:12px;color:var(--muted);margin-top:2px}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.badge-blue{background:#DBEAFE;color:var(--blue2)}
.badge-yellow{background:var(--yellow-l);color:var(--yellow)}
.badge-green{background:var(--green-l);color:var(--green)}
.badge-red{background:var(--red-l);color:var(--red)}
.lead-actions{display:flex;gap:8px;margin-top:10px}
.btn-sm{padding:6px 12px;border-radius:8px;font-size:12px;background:var(--bg);color:var(--text)}
.btn-sm:hover{background:#E5E9EE}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border-radius:18px;padding:28px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.modal h2{font-size:17px;margin-bottom:18px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.btn-outline{background:transparent;border:1px solid var(--border);padding:11px 18px;border-radius:10px;font-size:13px}
.btn-save{background:var(--blue);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px}

.fab{position:fixed;bottom:24px;right:24px;background:var(--green);color:#fff;width:56px;height:56px;border-radius:50%;font-size:26px;box-shadow:0 8px 24px rgba(6,170,72,.4);display:flex;align-items:center;justify-content:center}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 24px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;display:none}

.leads-tabs{display:flex;gap:8px;margin-bottom:16px}
.tab-btn{padding:10px 18px;border-radius:10px;font-size:13px;font-weight:700;background:var(--card);border:1px solid var(--border);color:var(--muted)}
.tab-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.tab-btn:hover:not(.active){background:var(--bg)}
</style>
</head>
<body>

<!-- TELA DE LOGIN -->
<div class="login-wrap" id="login-screen">
  <div class="login-card">
    <img src="/logo-icon.png" alt="BotClínica"/>
    <h1>Área do Parceiro</h1>
    <p>Cadastre seus leads e acompanhe suas comissões</p>
    <div class="error-msg" id="login-error"></div>
    <label>Código de acesso</label>
    <input type="text" id="login-id" placeholder="Ex: joao" autocomplete="username"/>
    <label>Senha</label>
    <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"/>
    <button class="btn-primary" onclick="doLogin()" id="login-btn">Entrar</button>
  </div>
</div>

<!-- APP (depois do login) -->
<div class="app" id="app-screen">
  <!-- Botão flutuante de Suporte — abre direto no WhatsApp de Suporte
       (Clara), que já reconhece automaticamente que quem está falando é
       um parceiro cadastrado, pelo telefone. -->
  <a
    href="https://wa.me/553191030288?text=Ol%C3%A1%2C%20preciso%20de%20ajuda%20com%20a%C3%A1rea%20do%20parceiro."
    target="_blank"
    rel="noopener noreferrer"
    style="position:fixed;bottom:24px;right:24px;z-index:999;width:56px;height:56px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,0.25);text-decoration:none;"
    title="Falar com o Suporte"
  >
    <svg viewBox="0 0 32 32" width="28" height="28" fill="#fff"><path d="M16.001 3C9.11 3 3.5 8.611 3.5 15.502c0 2.36.66 4.63 1.91 6.61L3 29l7.09-2.36a12.47 12.47 0 0 0 5.91 1.5h.005c6.891 0 12.502-5.611 12.502-12.502C28.507 8.611 22.896 3 16.001 3zm0 22.79h-.004a10.28 10.28 0 0 1-5.24-1.44l-.376-.223-3.936 1.31 1.32-3.834-.245-.393a10.24 10.24 0 0 1-1.58-5.508c0-5.675 4.618-10.293 10.297-10.293 2.75 0 5.335 1.072 7.28 3.019a10.23 10.23 0 0 1 3.014 7.284c0 5.675-4.618 10.293-10.53 10.078zm5.646-7.708c-.309-.155-1.828-.902-2.111-1.005-.283-.103-.489-.155-.695.155-.206.31-.798 1.005-.978 1.212-.18.206-.36.232-.669.077-.309-.155-1.305-.481-2.486-1.534-.919-.82-1.54-1.833-1.72-2.142-.18-.31-.019-.477.136-.631.14-.139.309-.361.464-.542.155-.18.206-.31.309-.516.103-.206.052-.387-.026-.542-.077-.155-.695-1.676-.953-2.294-.251-.601-.506-.52-.695-.53-.18-.008-.386-.01-.592-.01-.206 0-.542.077-.826.387-.283.31-1.082 1.057-1.082 2.578s1.108 2.99 1.262 3.196c.155.206 2.182 3.331 5.286 4.671.739.319 1.316.51 1.765.652.741.236 1.416.203 1.949.123.595-.089 1.828-.747 2.086-1.469.258-.722.258-1.34.181-1.469-.077-.129-.283-.206-.592-.361z"/></svg>
  </a>

  <div class="topbar">
    <div class="topbar-left">
      <img src="/logo-icon.png" alt="BotClínica"/>
      <div>
        <div class="name" id="partner-name">—</div>
        <div class="sub">Área do Parceiro · <span id="partner-rate">—</span>% de comissão</div>
      </div>
    </div>
    <button class="btn-logout" onclick="doLogout()">Sair</button>
  </div>

  <div class="container">
    <div class="card" id="earnings-card" style="background:linear-gradient(135deg,var(--navy),var(--blue2));color:#fff">
      <div style="font-size:12px;opacity:.8;font-weight:700;text-transform:uppercase">Total já ganho + pendente</div>
      <div style="font-size:32px;font-weight:800;margin-top:4px" id="earnings-total">R$ 0,00</div>
      <div style="font-size:12px;opacity:.85;margin-top:6px" id="earnings-breakdown">Carregando...</div>
    </div>

    <div class="grid-3">
      <div class="kpi"><div class="label">Meus leads</div><div class="val" id="kpi-total">0</div></div>
      <div class="kpi"><div class="label">Vendidos</div><div class="val" id="kpi-vendidos">0</div></div>
      <div class="kpi"><div class="label">Reunião marcada</div><div class="val" id="kpi-reunioes">0</div></div>
    </div>

    <div class="leads-tabs">
      <button class="tab-btn active" id="tab-btn-pool" onclick="switchLeadsTab('pool')">🎯 Leads Disponíveis (<span id="tab-count-pool">0</span>)</button>
      <button class="tab-btn" id="tab-btn-mine" onclick="switchLeadsTab('mine')">📋 Meus Leads (<span id="tab-count-mine">0</span>)</button>
    </div>

    <div class="card" id="card-pool">
      <div class="card-title">
        <span>🎯 Leads Disponíveis pra Pegar</span>
        <span style="font-size:11px;font-weight:600;color:var(--muted)" id="pool-limit-info">Limite: 10/dia</span>
      </div>
      <div id="pool-list"></div>
    </div>

    <div class="card" id="card-mine" style="display:none">
      <div class="card-title">
        <span>Meus leads</span>
        <button class="btn-save" onclick="openLeadModal()" style="padding:9px 16px">+ Novo Lead</button>
      </div>
      <div id="leads-list"></div>
    </div>

    <div class="card">
      <div class="card-title"><span>Minhas comissões</span></div>
      <div id="commissions-list"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const PROXY = '/api/fb';
let currentPartner = null;
let myLeads = [];
let editingLeadId = null;

async function api(action, payload){
  const r = await fetch(PROXY, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action, payload})});
  return r.json();
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(()=>{ t.style.display = 'none'; }, 2500);
}

// ── Login / sessão ──────────────────────────────────────────────────────
async function doLogin(){
  const id = document.getElementById('login-id').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  if(!id || !password){ errEl.textContent = 'Preencha código e senha.'; errEl.style.display = 'block'; return; }

  const btn = document.getElementById('login-btn');
  btn.textContent = 'Entrando...'; btn.disabled = true;

  const r = await api('partnerLogin', {id, password});
  btn.textContent = 'Entrar'; btn.disabled = false;

  if(r.error){ errEl.textContent = r.error; errEl.style.display = 'block'; return; }

  currentPartner = r.partner;
  sessionStorage.setItem('parceiro_session', JSON.stringify(currentPartner));

  if(currentPartner.primeiroAcesso){
    openFirstAccessModal();
  } else {
    showApp();
  }
}

// ── Primeiro acesso — troca de senha obrigatória ────────────────────────────
function openFirstAccessModal(){
  const html = `
    <div class="modal-overlay open" id="modal-first-access">
      <div class="modal">
        <h2>Bem-vindo(a), ${currentPartner.name}! 🎉</h2>
        <p style="font-size:13px;color:var(--muted);margin-bottom:16px">Antes de começar, crie sua senha de acesso pessoal — a senha temporária que você recebeu não vale mais depois disso.</p>
        <label>Nova senha</label>
        <input id="fa-password" type="password" placeholder="Mínimo 6 caracteres"/>
        <label>Confirmar senha</label>
        <input id="fa-confirm" type="password" placeholder="Repita a senha"/>
        <p id="fa-error" style="color:#DC2626;font-size:12px;margin-top:8px;display:none"></p>
        <div class="modal-actions">
          <button class="btn-save" id="fa-btn" onclick="submitFirstAccess()" style="width:100%">Definir Senha e Acessar o Painel →</button>
        </div>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}

async function submitFirstAccess(){
  const password = document.getElementById('fa-password').value;
  const confirm = document.getElementById('fa-confirm').value;
  const errEl = document.getElementById('fa-error');
  const btn = document.getElementById('fa-btn');
  errEl.style.display = 'none';

  if(password.length < 6){ errEl.textContent = 'A senha deve ter pelo menos 6 caracteres.'; errEl.style.display = 'block'; return; }
  if(password !== confirm){ errEl.textContent = 'As senhas não coincidem.'; errEl.style.display = 'block'; return; }

  btn.textContent = 'Salvando...'; btn.disabled = true;
  const r = await api('partnerSetPassword', { id: currentPartner.id, newPassword: password });
  if(r.error){
    errEl.textContent = r.error; errEl.style.display = 'block';
    btn.textContent = 'Definir Senha e Acessar o Painel →'; btn.disabled = false;
    return;
  }

  currentPartner.primeiroAcesso = false;
  sessionStorage.setItem('parceiro_session', JSON.stringify(currentPartner));
  document.getElementById('modal-first-access').remove();
  showApp();
}

function doLogout(){
  sessionStorage.removeItem('parceiro_session');
  currentPartner = null;
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

function showApp(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  document.getElementById('partner-name').textContent = currentPartner.name;
  document.getElementById('partner-rate').textContent = currentPartner.commissionRate;
  loadMyLeads();
  loadMyCommissions();
  loadAvailablePool();
}

// Restaura sessão se já estava logado (evita pedir senha de novo a cada F5)
(function restoreSession(){
  try {
    const saved = JSON.parse(sessionStorage.getItem('parceiro_session') || 'null');
    if(saved && saved.id){
      currentPartner = saved;
      if(currentPartner.primeiroAcesso){ openFirstAccessModal(); }
      else { showApp(); }
    }
  } catch(e){}
})();

// ── Abas: Leads Disponíveis vs Meus Leads ──────────────────────────────────
function switchLeadsTab(tab){
  document.getElementById('card-pool').style.display = tab === 'pool' ? 'block' : 'none';
  document.getElementById('card-mine').style.display = tab === 'mine' ? 'block' : 'none';
  document.getElementById('tab-btn-pool').classList.toggle('active', tab === 'pool');
  document.getElementById('tab-btn-mine').classList.toggle('active', tab === 'mine');
}

// Monta o link "wa.me" pra abrir o WhatsApp direto com o número da clínica,
// já com uma mensagem sugerida preenchida (o vendedor pode editar antes de
// mandar — o WhatsApp só preenche o campo, não envia sozinho).
function whatsappLink(phone, message){
  const digits = (phone || '').replace(/\D/g, '');
  const text = message ? '?text=' + encodeURIComponent(message) : '';
  return `https://wa.me/${digits}${text}`;
}

function openWhatsAppForLead(id){
  const l = myLeads.find(x => x.id === id);
  if(!l || !l.telefone){ toast('Esse lead não tem telefone cadastrado.'); return; }
  const msg = `Oi! Tudo bem? Meu nome é ${currentPartner.name}, sou parceiro comercial do BotClínica. Trabalho ajudando clínicas a organizarem melhor o atendimento via WhatsApp — principalmente marcação e confirmação de consulta, que costuma tomar bastante tempo da recepção. Como funciona hoje aí na ${l.nome}? É tudo manual, ou já usam alguma ferramenta?`;
  window.open(whatsappLink(l.telefone, msg), '_blank');
}

// ── Piscina de leads (clínicas encontradas, disponíveis pra reivindicar) ──
let availablePool = [];
let currentPoolStateFilter = null; // null = mostra todos os estados

// Mapa em "grade" (tile-grid) do Brasil — cada estado é um quadradinho na
// posição relativa real dele (Norte em cima, Sul embaixo). Escolhido em vez
// de um mapa geográfico de verdade porque garante que nenhum estado fica
// com contorno errado/distorcido — é o mesmo estilo usado em infográficos
// de dados (tipo NPR/G1), só que em grade em vez de forma real.
const BRAZIL_GRID = [
  { uf: 'RR', nome: 'Roraima', row: 1, col: 3 },
  { uf: 'AP', nome: 'Amapá', row: 1, col: 5 },
  { uf: 'AM', nome: 'Amazonas', row: 2, col: 2 },
  { uf: 'PA', nome: 'Pará', row: 2, col: 4 },
  { uf: 'MA', nome: 'Maranhão', row: 2, col: 6 },
  { uf: 'CE', nome: 'Ceará', row: 2, col: 7 },
  { uf: 'RN', nome: 'Rio Grande do Norte', row: 2, col: 8 },
  { uf: 'AC', nome: 'Acre', row: 3, col: 1 },
  { uf: 'RO', nome: 'Rondônia', row: 3, col: 3 },
  { uf: 'TO', nome: 'Tocantins', row: 3, col: 4 },
  { uf: 'PI', nome: 'Piauí', row: 3, col: 5 },
  { uf: 'PB', nome: 'Paraíba', row: 3, col: 6 },
  { uf: 'PE', nome: 'Pernambuco', row: 3, col: 7 },
  { uf: 'MT', nome: 'Mato Grosso', row: 4, col: 3 },
  { uf: 'BA', nome: 'Bahia', row: 4, col: 5 },
  { uf: 'AL', nome: 'Alagoas', row: 4, col: 6 },
  { uf: 'SE', nome: 'Sergipe', row: 4, col: 7 },
  { uf: 'MS', nome: 'Mato Grosso do Sul', row: 5, col: 2 },
  { uf: 'GO', nome: 'Goiás', row: 5, col: 3 },
  { uf: 'DF', nome: 'Distrito Federal', row: 5, col: 4 },
  { uf: 'MG', nome: 'Minas Gerais', row: 5, col: 5 },
  { uf: 'ES', nome: 'Espírito Santo', row: 5, col: 6 },
  { uf: 'SP', nome: 'São Paulo', row: 6, col: 3 },
  { uf: 'RJ', nome: 'Rio de Janeiro', row: 6, col: 4 },
  { uf: 'PR', nome: 'Paraná', row: 7, col: 3 },
  { uf: 'SC', nome: 'Santa Catarina', row: 8, col: 3 },
  { uf: 'RS', nome: 'Rio Grande do Sul', row: 9, col: 3 },
];

async function loadAvailablePool(){
  const d = await api('listLeadsPool', {onlyAvailable: true});
  availablePool = Array.isArray(d) ? d : [];
  renderAvailablePool();
}

function selectPoolState(uf){
  currentPoolStateFilter = (currentPoolStateFilter === uf) ? null : uf;
  renderAvailablePool();
}

function renderPoolMap(){
  // Conta quantos leads disponíveis existem em cada estado, pra colorir o
  // mapa com intensidade — quanto mais escuro, mais lead esperando lá.
  const contagemPorEstado = {};
  availablePool.forEach(l => {
    const uf = (l.estado || '').toUpperCase();
    if (uf) contagemPorEstado[uf] = (contagemPorEstado[uf] || 0) + 1;
  });
  const maxContagem = Math.max(1, ...Object.values(contagemPorEstado));

  const maxRow = Math.max(...BRAZIL_GRID.map(s => s.row));
  const maxCol = Math.max(...BRAZIL_GRID.map(s => s.col));

  const tilesHtml = BRAZIL_GRID.map(s => {
    const count = contagemPorEstado[s.uf] || 0;
    const intensidade = count > 0 ? 0.25 + (count / maxContagem) * 0.75 : 0;
    const isSelected = currentPoolStateFilter === s.uf;
    const semLead = count === 0;
    return `
      <button
        onclick="${semLead ? '' : `selectPoolState('${s.uf}')`}"
        title="${s.nome}${count ? ` — ${count} lead(s) disponível(is)` : ' — sem leads no momento'}"
        style="
          grid-row: ${s.row}; grid-column: ${s.col};
          background: ${isSelected ? 'var(--blue)' : (semLead ? '#F1F5F9' : `rgba(26,111,168,${intensidade})`)};
          color: ${isSelected || intensidade > 0.5 ? '#fff' : (semLead ? '#94A3B8' : 'var(--navy)')};
          border: 2px solid ${isSelected ? 'var(--blue2)' : 'transparent'};
          border-radius: 8px; font-size: 11px; font-weight: 800; font-family: sans-serif;
          width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
          cursor: ${semLead ? 'default' : 'pointer'}; transition: all 0.15s;
        "
        ${semLead ? 'disabled' : ''}
      >${s.uf}</button>
    `;
  }).join('');

  return `
    <div style="background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:16px;margin-bottom:16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div style="font-size:13px;font-weight:800;color:var(--navy)">🗺️ Leads disponíveis por estado</div>
        ${currentPoolStateFilter ? `<button onclick="selectPoolState('${currentPoolStateFilter}')" style="font-size:11px;color:var(--blue);font-weight:700;background:none;border:none;cursor:pointer">✕ Limpar filtro (${currentPoolStateFilter})</button>` : ''}
      </div>
      <div style="display:grid; grid-template-rows: repeat(${maxRow}, 38px); grid-template-columns: repeat(${maxCol}, 38px); gap:4px; overflow-x:auto; padding-bottom:4px">
        ${tilesHtml}
      </div>
      <div style="font-size:10px;color:var(--muted);margin-top:8px">Clique num estado colorido pra ver só os leads de lá. Estados cinza ainda não têm lead na piscina.</div>
    </div>
  `;
}

function renderAvailablePool(){
  document.getElementById('tab-count-pool').textContent = availablePool.length;
  const el = document.getElementById('pool-list');

  const poolMapHtml = renderPoolMap();

  const filtrados = currentPoolStateFilter
    ? availablePool.filter(l => (l.estado || '').toUpperCase() === currentPoolStateFilter)
    : availablePool;

  if(availablePool.length===0){
    el.innerHTML = poolMapHtml + '<div class="empty">Nenhum lead disponível na piscina agora. Volta mais tarde — novas clínicas são adicionadas periodicamente.</div>';
    return;
  }

  const listaHtml = filtrados.length === 0
    ? `<div class="empty">Nenhum lead disponível em ${currentPoolStateFilter} no momento.</div>`
    : filtrados.map(l => `
    <div class="lead-item">
      <div class="top">
        <div>
          <div class="nome">${l.nome}</div>
          <div class="contato">${l.cidade||''}${l.estado?' - '+l.estado:''}${l.telefone?' · '+l.telefone:''}</div>
        </div>
        ${l.tipo?`<span class="badge badge-blue">${l.tipo}</span>`:''}
      </div>
      ${l.endereco?`<div style="font-size:12px;color:var(--muted);margin-top:6px">${l.endereco}</div>`:''}
      ${l.avaliacao?`<div style="font-size:12px;color:var(--muted)">⭐ ${l.avaliacao}</div>`:''}
      ${l.sinalPotencial?`<div style="font-size:12px;color:var(--navy);margin-top:4px;font-weight:600">💡 ${l.sinalPotencial}</div>`:''}
      <div class="lead-actions">
        <button class="btn-sm" style="background:var(--green);color:#fff" onclick="claimPoolLead('${l.id}')">✋ Pegar esse lead</button>
      </div>
    </div>
  `).join('');

  el.innerHTML = poolMapHtml + listaHtml;
}

async function claimPoolLead(id){
  const r = await api('claimLead', {leadPoolId: id, partnerId: currentPartner.id});
  if(r.error){ toast(r.error); return; }
  toast('✅ Lead reivindicado! Já apareceu em "Meus leads".');
  await loadAvailablePool();
  await loadMyLeads();
  switchLeadsTab('mine');
}

// ── Leads ───────────────────────────────────────────────────────────────
const STATUS_LABEL = {
  novo: '🆕 Novo', reuniao_marcada: '📅 Reunião marcada', negociando: '💬 Negociando',
  vendido: '💰 Vendido', perdido: '❌ Perdido', cancelado: '🚫 Cancelado pela clínica',
  sem_whatsapp: '📵 Não tem WhatsApp', nao_responde: '🔇 Não responde',
};
const STATUS_BADGE = {
  novo: 'badge-blue', reuniao_marcada: 'badge-yellow', negociando: 'badge-yellow',
  vendido: 'badge-green', perdido: 'badge-red', cancelado: 'badge-red',
  sem_whatsapp: 'badge-red', nao_responde: 'badge-yellow',
};
const PLAN_LABEL = { starter:'Starter', profissional:'Profissional', clinica:'Clínica', premium:'Premium' };

async function loadMyLeads(){
  const d = await api('listPartnerLeads', {partnerId: currentPartner.id});
  myLeads = Array.isArray(d) ? d : [];
  renderLeads();
}

let currentLeadFilter = 'todos';

function setLeadFilter(status){
  currentLeadFilter = status;
  renderLeads();
}

function renderLeads(){
  document.getElementById('tab-count-mine').textContent = myLeads.length;
  document.getElementById('kpi-total').textContent = myLeads.length;
  document.getElementById('kpi-vendidos').textContent = myLeads.filter(l=>l.status==='vendido').length;
  document.getElementById('kpi-reunioes').textContent = myLeads.filter(l=>l.status==='reuniao_marcada').length;

  const el = document.getElementById('leads-list');
  if(myLeads.length===0){
    el.innerHTML = '<div class="empty">Nenhum lead cadastrado ainda. Clique em "+ Novo Lead" pra começar.</div>';
    return;
  }

  const leadCardHtml = (l) => `
    <div class="lead-item">
      <div class="top">
        <div>
          <div class="nome">${l.nome}</div>
          <div class="contato">${l.email||''} ${l.telefone?'· '+l.telefone:''}</div>
        </div>
        <span class="badge ${l.vendaConfirmada?'badge-green':(STATUS_BADGE[l.status]||'badge-blue')}">${l.vendaConfirmada?'✅ Confirmado':(STATUS_LABEL[l.status]||l.status)}</span>
      </div>
      ${l.plano?`<div style="font-size:12px;color:var(--muted);margin-top:8px">Plano: ${PLAN_LABEL[l.plano]||l.plano}${l.addon?' + Add-on Documentos':''}</div>`:''}
      ${l.reuniaoData?`<div style="font-size:12px;color:var(--muted)">Reunião: ${new Date(l.reuniaoData+'T12:00:00').toLocaleDateString('pt-BR')}${l.reuniaoHora?' às '+l.reuniaoHora:''}</div>`:''}
      ${l.notas?`<div style="font-size:12px;color:var(--muted);margin-top:4px">${l.notas}</div>`:''}
      ${!l.vendaConfirmada?`<div class="lead-actions"><button class="btn-sm" onclick='openLeadModal(${JSON.stringify(l).replace(/'/g,"&apos;")})'>✏️ Editar</button>${l.telefone?`<button class="btn-sm" style="background:#25D366;color:#fff" onclick="openWhatsAppForLead('${l.id}')">💬 WhatsApp</button>`:''}<button class="btn-sm" style="color:var(--red)" onclick="deleteLead('${l.id}','${l.nome.replace(/'/g,"\\'")}')">🗑️ Excluir</button></div>`:''}
    </div>
  `;

  // Lembrete de reuniões de HOJE — sempre visível, independente do filtro
  // selecionado, já que é informação urgente do dia.
  const todayStr = new Date().toISOString().slice(0, 10);
  const reunioesHoje = myLeads
    .filter(l => l.status === 'reuniao_marcada' && l.reuniaoData === todayStr)
    .sort((a, b) => (a.reuniaoHora || '99:99').localeCompare(b.reuniaoHora || '99:99'));

  const lembreteHtml = reunioesHoje.length > 0 ? `
    <div style="background:#FEF3C7;border:1px solid #FCD34D;border-radius:12px;padding:14px 16px;margin-bottom:16px">
      <div style="font-weight:800;font-size:14px;color:#92400E;margin-bottom:8px">
        ⏰ Você tem ${reunioesHoje.length} reunião${reunioesHoje.length > 1 ? 'ões' : ''} hoje!
      </div>
      ${reunioesHoje.map(l => `
        <div style="font-size:13px;color:#78350F;padding:4px 0">
          ${l.reuniaoHora ? `<strong>${l.reuniaoHora}</strong> — ` : ''}${l.nome}
        </div>
      `).join('')}
    </div>
  ` : '';

  // NOVO — botões de filtro por status (mesmo padrão já usado em Central
  // de Atendimento: clica, mostra só aquele status, clica em "Todos" pra
  // voltar a ver tudo junto).
  const STATUS_ORDEM = ['reuniao_marcada', 'negociando', 'novo', 'vendido', 'sem_whatsapp', 'nao_responde', 'perdido', 'cancelado'];
  const filtrosHtml = `
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px">
      <button
        onclick="setLeadFilter('todos')"
        class="btn-sm"
        style="${currentLeadFilter==='todos' ? 'background:var(--blue);color:#fff' : ''}"
      >Todos (${myLeads.length})</button>
      ${STATUS_ORDEM.map(status => {
        const count = myLeads.filter(l => l.status === status).length;
        if (count === 0) return '';
        return `
          <button
            onclick="setLeadFilter('${status}')"
            class="btn-sm"
            style="${currentLeadFilter===status ? 'background:var(--blue);color:#fff' : ''}"
          >${STATUS_LABEL[status]} (${count})</button>
        `;
      }).join('')}
    </div>
  `;

  const leadsFiltrados = currentLeadFilter === 'todos'
    ? myLeads
    : myLeads.filter(l => l.status === currentLeadFilter);

  const listaHtml = leadsFiltrados.length > 0
    ? leadsFiltrados.map(leadCardHtml).join('')
    : '<div class="empty">Nenhum lead com esse status.</div>';

  el.innerHTML = lembreteHtml + filtrosHtml + listaHtml;
}

const COMM_STATUS_LABEL = {
  aguardando_carencia: '⏳ Aguardando período de garantia',
  elegivel: '✅ Liberado pra receber',
  pago: '💰 Já recebido',
  cancelado: '🚫 Cancelado (cliente desistiu)',
};
const COMM_STATUS_BADGE = {
  aguardando_carencia: 'badge-yellow', elegivel: 'badge-green', pago: 'badge-blue', cancelado: 'badge-red',
};

let myCommissions = [];

async function loadMyCommissions(){
  const d = await api('listPartnerCommissions', {partnerId: currentPartner.id});
  myCommissions = Array.isArray(d) ? d : [];
  renderCommissions();
}

function renderCommissions(){
  const pendente = myCommissions.filter(c=>c.status==='aguardando_carencia'||c.status==='elegivel').reduce((s,c)=>s+c.valorComissao,0);
  const recebido = myCommissions.filter(c=>c.status==='pago').reduce((s,c)=>s+c.valorComissao,0);
  const total = pendente + recebido;

  document.getElementById('earnings-total').textContent = 'R$ ' + total.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
  document.getElementById('earnings-breakdown').textContent =
    `Já recebido: R$ ${recebido.toLocaleString('pt-BR',{minimumFractionDigits:2})} · Ainda a receber: R$ ${pendente.toLocaleString('pt-BR',{minimumFractionDigits:2})}`;

  const el = document.getElementById('commissions-list');
  if(myCommissions.length===0){
    el.innerHTML = '<div class="empty">Suas comissões aparecem aqui assim que uma venda sua for confirmada.</div>';
    return;
  }
  el.innerHTML = myCommissions.map(c => `
    <div class="lead-item">
      <div class="top">
        <div>
          <div class="nome">${c.clinicName || c.clinicEmail}</div>
          <div class="contato">Plano ${PLAN_LABEL[c.plano]||c.plano} · Comissão de ${c.commissionRate}%</div>
        </div>
        <span class="badge ${COMM_STATUS_BADGE[c.status]||'badge-yellow'}">${COMM_STATUS_LABEL[c.status]||c.status}</span>
      </div>
      <div style="font-size:18px;font-weight:800;margin-top:8px;color:var(--navy)">R$ ${c.valorComissao.toLocaleString('pt-BR',{minimumFractionDigits:2})}</div>
      ${c.status==='aguardando_carencia'?`<div style="font-size:12px;color:var(--muted);margin-top:4px">Libera em ${new Date(c.eligibleDate).toLocaleDateString('pt-BR')}</div>`:''}
      ${c.status==='pago'?`<div style="font-size:12px;color:var(--muted);margin-top:4px">Pago em ${new Date(c.paidAt).toLocaleDateString('pt-BR')}</div>`:''}
    </div>
  `).join('');
}

function openLeadModal(lead){
  editingLeadId = lead ? lead.id : null;
  const l = lead || {nome:'',email:'',telefone:'',plano:'',addon:false,status:'novo',reuniaoData:'',notas:''};
  const html = `
    <div class="modal-overlay open" id="modal-lead">
      <div class="modal">
        <h2>${lead?'Editar':'Novo'} Lead</h2>
        <label>Nome do responsável pela clínica</label>
        <input id="lf-nome" value="${l.nome}" placeholder="Ex: Dra. Ana Souza"/>
        <div class="form-row">
          <div><label>E-mail</label><input id="lf-email" value="${l.email}" placeholder="ana@clinica.com"/></div>
          <div><label>Telefone/WhatsApp</label><input id="lf-telefone" value="${l.telefone}" placeholder="(31) 99999-9999"/></div>
        </div>
        <div class="form-row">
          <div>
            <label>Plano de interesse</label>
            <select id="lf-plano">
              <option value="">— Ainda não definido —</option>
              <option value="starter" ${l.plano==='starter'?'selected':''}>Starter</option>
              <option value="profissional" ${l.plano==='profissional'?'selected':''}>Profissional</option>
              <option value="clinica" ${l.plano==='clinica'?'selected':''}>Clínica</option>
              <option value="premium" ${l.plano==='premium'?'selected':''}>Premium</option>
            </select>
          </div>
          <div>
            <label>Status</label>
            <select id="lf-status">
              <option value="novo" ${l.status==='novo'?'selected':''}>🆕 Novo</option>
              <option value="reuniao_marcada" ${l.status==='reuniao_marcada'?'selected':''}>📅 Reunião marcada</option>
              <option value="negociando" ${l.status==='negociando'?'selected':''}>💬 Negociando</option>
              <option value="vendido" ${l.status==='vendido'?'selected':''}>💰 Vendido</option>
              <option value="perdido" ${l.status==='perdido'?'selected':''}>❌ Perdido</option>
              <option value="sem_whatsapp" ${l.status==='sem_whatsapp'?'selected':''}>📵 Não tem WhatsApp</option>
              <option value="nao_responde" ${l.status==='nao_responde'?'selected':''}>🔇 Não responde</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label><input type="checkbox" id="lf-addon" ${l.addon?'checked':''} style="width:auto;display:inline;margin-right:6px"/>Interessado no add-on de Documentos</label>
          </div>
          <div class="form-row" style="gap:8px">
            <div><label>Data da reunião</label><input id="lf-reuniao" type="date" value="${l.reuniaoData}"/></div>
            <div><label>Horário</label><input id="lf-reuniao-hora" type="time" value="${l.reuniaoHora||''}"/></div>
          </div>
        </div>
        <label>Notas (opcional)</label>
        <textarea id="lf-notas" rows="3" placeholder="Qualquer observação relevante sobre essa negociação...">${l.notas}</textarea>
        <div class="modal-actions">
          <button class="btn-outline" onclick="closeLeadModal()">Cancelar</button>
          <button class="btn-save" onclick="saveLead()">Salvar</button>
        </div>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}

function closeLeadModal(){
  const m = document.getElementById('modal-lead');
  if(m) m.remove();
  editingLeadId = null;
}

async function saveLead(){
  const nome = document.getElementById('lf-nome').value.trim();
  if(!nome){ toast('Preencha o nome.'); return; }
  const payload = {
    leadId: editingLeadId,
    partnerId: currentPartner.id,
    nome,
    email: document.getElementById('lf-email').value.trim(),
    telefone: document.getElementById('lf-telefone').value.trim(),
    plano: document.getElementById('lf-plano').value,
    addon: document.getElementById('lf-addon').checked,
    status: document.getElementById('lf-status').value,
    reuniaoData: document.getElementById('lf-reuniao').value,
    reuniaoHora: document.getElementById('lf-reuniao-hora').value,
    notas: document.getElementById('lf-notas').value.trim(),
  };
  const r = await api('savePartnerLead', payload);
  if(r.error){ toast('Erro: '+r.error); return; }
  closeLeadModal();
  await loadMyLeads();
  if(r.replacementLead){
    toast(`Sem problema! Já liberamos um novo lead pra você: "${r.replacementLead.nome}".`);
  } else {
    toast('Lead salvo com sucesso!');
  }
}

async function deleteLead(id, nome){
  if(!confirm(`Excluir o lead "${nome}"? Essa ação não pode ser desfeita.`)) return;
  const r = await api('deletePartnerLead', {id});
  if(r.error){ toast('Erro: '+r.error); return; }
  await loadMyLeads();
  toast('Lead excluído.');
}

// Enter no campo de senha já envia o login
document.getElementById('login-password').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
